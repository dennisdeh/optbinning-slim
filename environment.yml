# Conda environment for developing and testing optbinning-slim.
#
#   conda env create -f environment.yml      # from the repository root
#   conda activate optbinning
#
# Only the interpreter comes from conda. Every project dependency is resolved from
# pyproject.toml through the editable pip install below, so the dependency set is
# declared in exactly one place. To recreate the environment after a dependency
# change, `pip install -e ".[dev]"` is enough — the environment does not need
# rebuilding.
name: optbinning
channels:
  - conda-forge
dependencies:
  - python>=3.13,<3.15
  - pip
  - pip:
      - --editable .[dev]
