# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      # Report every cell. Cancelling the rest on the first failure hid a
      # second, unrelated failure on the 3.13 jobs behind the 3.14 one for
      # seven consecutive runs; the surviving annotation only ever named
      # whichever job happened to finish first.
      fail-fast: false
      matrix:

        python-version: ["3.13", "3.14"]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[distributed,test]"
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest

  package:
    # Gates the release artifacts on every push, so a broken sdist or a
    # long_description PyPI will not render is caught before a release is cut.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
    - name: Check metadata
      run: python -m twine check --strict dist/*
    - name: Upload artifacts
      uses: actions/upload-artifact@v5
      with:
        name: dist
        path: dist/
